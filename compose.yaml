name: relay
services:
  sub2api:
    image: ${SUB2API_IMAGE:-ghcr.io/wei-shaw/sub2api:latest}
    restart: unless-stopped
    environment:
      AUTO_SETUP: "true"
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: "8080"
      SERVER_MODE: release
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_USER: sub2api
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?required}
      DATABASE_DBNAME: sub2api
      DATABASE_SSLMODE: disable
      DATABASE_MAX_OPEN_CONNS: "40"
      DATABASE_MAX_IDLE_CONNS: "10"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      ADMIN_EMAIL: ${SUB2API_ADMIN_EMAIL:-admin@relay.local}
      ADMIN_PASSWORD: ${SUB2API_ADMIN_PASSWORD:?required}
      JWT_SECRET: ${JWT_SECRET:?required}
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY:?required}
      TZ: Asia/Shanghai
    volumes: ["sub2api:/app/data"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "5", "-O", "/dev/null", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 3
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sub2api
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      POSTGRES_DB: sub2api
      PGDATA: /var/lib/postgresql/data
    volumes: ["postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sub2api -d sub2api"]
      interval: 10s
      timeout: 5s
      retries: 20
  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp", "8443:8443"]
    environment:
      PUBLIC_IP: ${PUBLIC_IP:-}
      GATEWAY_DOMAIN: ${GATEWAY_DOMAIN:-}
    volumes:
      - ./${CADDY_CONFIG:-Caddyfile}:/etc/caddy/Caddyfile:ro
      - caddy:/data
      - caddy_config:/config
    depends_on: [sub2api]
  # Outbound proxy for OpenAI (region-blocks mainland IPs). Needs mihomo/config.yaml
  # (git-ignored; copy from config.example.yaml and set the subscription URL).
  mihomo:
    image: ${MIHOMO_IMAGE:-metacubex/mihomo:latest}
    restart: unless-stopped
    volumes: ["./mihomo:/root/.config/mihomo"]
    ports: ["127.0.0.1:7890:7890"]
volumes:
  sub2api:
  postgres:
  redis:
  caddy:
  caddy_config:
